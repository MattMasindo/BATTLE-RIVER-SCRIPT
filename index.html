function scriptProgress(stepKey) {
  var v = STEP_PROGRESS[stepKey];
  return v == null ? 0 : v;
}
 
function daysSince(ts) { return Math.floor((Date.now() - ts) / 86400000); }
 
function fmtAgo(ts) {
  if (!ts) return "";
  var mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  var d = Math.floor(hrs / 24);
  if (d === 1) return "yesterday";
  if (d < 7) return d + "d ago";
  var w = Math.floor(d / 7);
  if (d < 30) return w === 1 ? "1 week ago" : w + " weeks ago";
  var mo = Math.floor(d / 30);
  return mo === 1 ? "1 month ago" : mo + " months ago";
}
 
// Thresholds follow the script's own cadence: warm market is daily,
// cold market weekly — so 3 days is a nudge, 7 days is overdue.
function urgency(convo) {
  if (FINISHED[convo.step]) return "none";
  var d = daysSince(convo.updated);
  if (d >= 7) return "high";
  if (d >= 3) return "medium";
  return "low";
}
 
function urgencyColor(level) {
  if (level === "high") return "#E2603F";
  if (level === "medium") return "#F0B040";
  return "#8CA5BD";
}
 
function sortConvos(list, mode) {
  return list.slice().sort(function (a, b) {
    var af = FINISHED[a.step] ? 1 : 0, bf = FINISHED[b.step] ? 1 : 0;
    if (af !== bf) return af - bf;                    // finished always last
    if (mode === "stale") return a.updated - b.updated;  // longest untouched first
    return b.updated - a.updated;                     // most recently touched first
  });
}
 
function lget(k, fallback) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function lset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
 
function fill(text, name) {
  var n = (name || "").trim();
  return text.replace(/\{name\}/g, n || "friend");
}
 
// Clipboard with a fallback — the Messenger in-app browser often blocks
// navigator.clipboard, and a silent failure here would break the whole point.
function copyText(text, done) {
  function fallback() {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      done(ok);
    } catch (e) { done(false); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
  } else { fallback(); }
}

// PATCH 1 — cloud backup / restore / export helpers.
// Nothing in this section touches STEPS, STAGES, or the 26-step flow.
// ======================================================================
 
// Per-advisor local storage bucket. Keeping conversations keyed by advisor
// id (rather than the single old "br-convos" key) is what stops a device
// changing hands from mixing one advisor's data into another's.
function convosKey(advisorId) { return "br-convos-" + advisorId; }
function syncMetaKey(advisorId) { return "br-sync-meta-" + advisorId; }
 
function rosterSelectColumns() {
  var cols = [ADVISOR_ID_COLUMN, ADVISOR_NAME_COLUMN];
  if (ADVISOR_ACTIVE_COLUMN) cols.push(ADVISOR_ACTIVE_COLUMN);
  if (ADVISOR_APPROVED_COLUMN) cols.push(ADVISOR_APPROVED_COLUMN);
  if (ADVISOR_CODE_COLUMN) cols.push(ADVISOR_CODE_COLUMN);
  return cols.join(",");
}
 
async function fetchRoster() {
  if (!supabaseClient) return { error: "Cloud isn't configured yet." };
  try {
    var q = supabaseClient.from(ADVISOR_TABLE).select(rosterSelectColumns()).order(ADVISOR_NAME_COLUMN, { ascending: true });
    if (ADVISOR_ACTIVE_COLUMN) q = q.eq(ADVISOR_ACTIVE_COLUMN, true);
    if (ADVISOR_APPROVED_COLUMN) q = q.eq(ADVISOR_APPROVED_COLUMN, true);
    var res = await q;
    if (res.error) return { error: res.error.message };
    return {
      data: (res.data || []).map(function (row) {
        return { id: row[ADVISOR_ID_COLUMN], name: row[ADVISOR_NAME_COLUMN], code: ADVISOR_CODE_COLUMN ? row[ADVISOR_CODE_COLUMN] : null };
      })
    };
  } catch (e) { return { error: "Couldn't reach the advisor list." }; }
}
 
// Backfills `code` onto an advisor identity that was cached locally before
// this feature shipped (so `br-advisor` in localStorage predates the
// `code` field). Safe to call any time — a no-op once the code is cached.
async function fetchAdvisorCode(advisorId) {
  if (!supabaseClient || !ADVISOR_CODE_COLUMN) return { error: "Cloud isn't configured yet." };
  try {
    var res = await supabaseClient.from(ADVISOR_TABLE).select(ADVISOR_CODE_COLUMN).eq(ADVISOR_ID_COLUMN, advisorId).maybeSingle();
    if (res.error || !res.data) return { error: "Couldn't reach the advisor list." };
    return { data: res.data[ADVISOR_CODE_COLUMN] || null };
  } catch (e) { return { error: "Couldn't reach the advisor list." }; }
}
 
// Checks a single advisor's current approval status by id. Used to
// re-check a pending self-signup without re-fetching (and re-filtering)
// the whole roster.
async function checkAdvisorApproval(advisorId) {
  if (!supabaseClient) return { error: "Cloud isn't configured yet." };
  try {
    var cols = [ADVISOR_ID_COLUMN, ADVISOR_NAME_COLUMN, ADVISOR_APPROVED_COLUMN].concat(ADVISOR_CODE_COLUMN ? [ADVISOR_CODE_COLUMN] : []).join(",");
    var res = await supabaseClient.from(ADVISOR_TABLE).select(cols).eq(ADVISOR_ID_COLUMN, advisorId).maybeSingle();
    if (res.error || !res.data) return { error: "Couldn't check right now — try again." };
    var approved = res.data[ADVISOR_APPROVED_COLUMN] !== false;
    return { data: { approved: approved, id: res.data[ADVISOR_ID_COLUMN], name: res.data[ADVISOR_NAME_COLUMN], code: ADVISOR_CODE_COLUMN ? res.data[ADVISOR_CODE_COLUMN] : null } };
  } catch (e) { return { error: "Couldn't reach the server — try again." }; }
}
 
// Self-service "I'm new here" / "Add a teammate" roster signup. Requires an
// anon INSERT policy on ADVISOR_TABLE that does not exist by default (see
// the migration note) — until that policy is granted, this fails with a
// normal, non-crashing error message rather than doing anything silently.
// Always inserts approved: false — a manager has to approve the row from
// the Dashboard's Manager tab before it appears in anyone's roster/picker
// or can be signed into. Any other column on your real table (e.g. the
// "code" column) is left to the database's own defaults/nulls, since this
// app has no way to know what value those should hold — the manager fills
// code in when they approve.
async function addSelfAsAdvisor(name) {
  if (!supabaseClient) return { error: "Cloud isn't configured yet." };
  var nm = name.trim();
  if (!nm) return { error: "Enter your name first." };
  try {
    var row = {};
    row[ADVISOR_NAME_COLUMN] = nm;
    if (ADVISOR_ACTIVE_COLUMN) row[ADVISOR_ACTIVE_COLUMN] = true;
    if (ADVISOR_APPROVED_COLUMN) row[ADVISOR_APPROVED_COLUMN] = false;
    var res = await supabaseClient.from(ADVISOR_TABLE).insert(row).select(rosterSelectColumns()).single();
    if (res.error) return { error: res.error.message };
    var r = res.data;
    return { data: { id: r[ADVISOR_ID_COLUMN], name: r[ADVISOR_NAME_COLUMN] } };
  } catch (e) { return { error: "Couldn't add you to the roster." }; }
}
 
// ======================================================================
// DASHBOARD ACTIVITY AUTO-LOG — calls the SAME bump_metric() RPC the
// Dashboard's own tap counters use, so New Prospects (Names List add),
// Chat Script Usage (each step advanced), and Appointments Set (reaching
// appt_confirm) show up on the Dashboard without the advisor re-entering
// anything by hand. Manual dashboard taps and these auto-bumps simply add
// together — same as if two real events both happened.
//
// Requires the advisor's `code` (see ADVISOR_CODE_COLUMN / fetchAdvisorCode
// above) — an advisor whose code hasn't loaded yet silently skips logging
// rather than erroring, since code is expected to arrive moments later via
// the backfill effect.
//
// Offline-safe: a failed bump (no signal, RPC hiccup) is queued locally and
// retried alongside the existing conversation/prospect sync retries — it
// never blocks navigation and never shows an error to the advisor.
// ======================================================================
function phTodayStr() {
  var d = new Date();
  function p(n) { return n < 10 ? "0" + n : "" + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
 
var PENDING_BUMPS_KEY = "br-pending-metric-bumps";
function getPendingBumps() { return lget(PENDING_BUMPS_KEY, []); }
function setPendingBumps(list) { lset(PENDING_BUMPS_KEY, list); }
 
async function callBumpMetric(entry) {
  if (!supabaseClient) return false;
  try {
    var res = await supabaseClient.rpc("bump_metric", { p_code: entry.code, p_date: entry.date, p_field: entry.field, p_delta: entry.delta });
    return !res.error;
  } catch (e) { return false; }
}
 
// Returns a real status instead of firing blind, so callers (specifically
// the Appointments Set toast) can tell the advisor the truth rather than
// always claiming success. "no_code" is a distinct, actionable case: it
// means this advisor's roster row has no code assigned yet, which can
// only be fixed by a manager (Dashboard -> Manager tab), not by retrying.
async function bumpDashboardMetric(code, field, delta) {
  if (!code) return { ok: false, reason: "no_code" };
  var entry = { code: code, date: phTodayStr(), field: field, delta: delta };
  var ok = await callBumpMetric(entry);
  if (!ok) { setPendingBumps(getPendingBumps().concat([entry])); return { ok: false, reason: "queued" }; }
  return { ok: true };
}
 
var bumpFlushInFlight = false;
async function flushPendingBumps() {
  if (bumpFlushInFlight) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) return;
  var pending = getPendingBumps();
  if (pending.length === 0) return;
  bumpFlushInFlight = true;
  try {
    var stillPending = [];
    for (var i = 0; i < pending.length; i++) {
      var ok = await callBumpMetric(pending[i]);
      if (!ok) stillPending.push(pending[i]);
    }
    setPendingBumps(stillPending);
  } catch (e) {
    // swallow — same silent-background philosophy as the rest of this app
  } finally {
    bumpFlushInFlight = false;
  }
}
 
// ======================================================================
// PATCH 3 — PIN gate. verify_advisor_pin() lives entirely server-side
// (SECURITY DEFINER, never returns the hash) — see SUPABASE_MIGRATIONS_PATCH3.sql.
// The RPC itself decides "first time, set it" vs "compare it"; this client
// helper just calls it and turns the jsonb result into something the UI
// can read plainly.
// ======================================================================
async function verifyAdvisorPin(advisorId, pin) {
  if (!supabaseClient) return { error: "Cloud isn't configured yet." };
  try {
    var res = await supabaseClient.rpc("verify_advisor_pin", { p_advisor_id: advisorId, p_pin: pin });
    if (res.error) return { error: "Couldn't check that PIN \u2014 try again." };
    var d = res.data || {};
    if (d.error === "pin_too_short") return { error: "PIN must be at least 4 digits." };
    if (d.error === "not_found") return { error: "That advisor couldn't be found." };
    if (d.error === "locked") return { error: "Too many wrong tries \u2014 wait a few minutes and try again." };
    if (!d.ok) return { error: "Wrong PIN \u2014 try again." };
    return { data: { created: !!d.created } };
  } catch (e) { return { error: "Couldn't reach the server \u2014 try again." }; }
}
 
// ======================================================================
// PATCH 3 — daily overdue digest via OneSignal Web Push. Everything here
// no-ops quietly if ONESIGNAL_APP_ID is still the placeholder or the SDK
// hasn't loaded, matching the existing "safe until configured" pattern.
// ======================================================================
function initOneSignal() {
  if (!isOneSignalConfigured()) return;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(function (OneSignal) {
    OneSignal.init({ appId: ONESIGNAL_APP_ID });
  });
}
 
// Reads the current push subscription id, if any, from the OneSignal SDK.
// Resolves null (never rejects) if OneSignal isn't ready yet or isn't
// configured \u2014 callers treat null as "no subscription yet".
function getOneSignalSubscriptionId() {
  return new Promise(function (resolve) {
    if (!isOneSignalConfigured() || !window.OneSignalDeferred) { resolve(null); return; }
    window.OneSignalDeferred.push(function (OneSignal) {
      try { resolve(OneSignal.User.PushSubscription.id || null); }
      catch (e) { resolve(null); }
    });
  });
}
 
// Prompts for notification permission (if not already granted/denied) and
// upserts the resulting subscription id + opt-in flag to advisor_push_subs.
// Safe to call repeatedly \u2014 re-subscribing on a new device simply
// overwrites the previous row for this advisor.
async function enableDigestPush(advisorId) {
  if (!supabaseClient) return { error: "Cloud isn't configured yet." };
  if (!isOneSignalConfigured()) return { error: "Push isn't configured yet." };
  // Deliberately NOT routed through OneSignalDeferred.push() here \u2014 Safari
  // only shows its permission prompt when requestPermission() is called
  // directly within the click's own call stack. Queuing it onto OneSignal's
  // deferred array (fine for init, which needs no user gesture) breaks that
  // chain on Safari specifically: the prompt never appears and the promise
  // just hangs, which is exactly the "stuck on Working\u2026" symptom this fixes.
  // By the time Settings is reachable, initOneSignal() (called at module
  // load) has had many seconds to finish, so window.OneSignal is expected
  // to already be the real SDK object, not just the queue.
  if (!window.OneSignal || !window.OneSignal.Notifications) {
    return { error: "Notifications are still loading \u2014 wait a moment and try again." };
  }
  try {
    var timedOut = { timedOut: true };
    var result = await Promise.race([
      window.OneSignal.Notifications.requestPermission(),
      new Promise(function (resolve) { setTimeout(function () { resolve(timedOut); }, 15000); })
    ]);
    if (result === timedOut) return { error: "No response from the notification prompt \u2014 try again." };
    var subId = window.OneSignal.User.PushSubscription.id || null;
    if (!subId) return { error: "Notifications weren't enabled \u2014 check your browser's permission settings." };
    var res = await supabaseClient.from("advisor_push_subs").upsert({
      advisor_id: advisorId, onesignal_player_id: subId, digest_opt_in: true, updated_at: new Date().toISOString()
    }, { onConflict: "advisor_id" });
    if (res.error) return { error: "Saved locally, but couldn't reach the server \u2014 try again." };
    return { data: true };
  } catch (e) { return { error: "Couldn't enable notifications \u2014 try again." }; }
}
 
async function disableDigestPush(advisorId) {
  if (!supabaseClient) return { error: "Cloud isn't configured yet." };
  try {
    var res = await supabaseClient.from("advisor_push_subs")
      .upsert({ advisor_id: advisorId, digest_opt_in: false, updated_at: new Date().toISOString() }, { onConflict: "advisor_id" });
    if (res.error) return { error: "Couldn't reach the server \u2014 try again." };
    return { data: true };
  } catch (e) { return { error: "Couldn't reach the server \u2014 try again." }; }
}
 
async function fetchDigestOptIn(advisorId) {
  if (!supabaseClient) return { data: false };
  try {
    var res = await supabaseClient.from("advisor_push_subs").select("digest_opt_in").eq("advisor_id", advisorId).maybeSingle();
    if (res.error || !res.data) return { data: false };
    return { data: !!res.data.digest_opt_in };
  } catch (e) { return { data: false }; }
}
 
async function fetchCloudConvos(advisorId) {
  if (!supabaseClient) return { data: [] };
  try {
    var res = await supabaseClient.from(CONVERSATIONS_TABLE).select("*").eq("advisor_id", advisorId).is("deleted_at", null);
    if (res.error) return { data: [], error: res.error.message };
    return { data: res.data || [] };
  } catch (e) { return { data: [], error: "Couldn't reach the backup." }; }

function toRemoteRow(advisorId, c) {
  return {
    advisor_id: advisorId,
    convo_id: c.id,
    client_name: c.name,
    current_step: c.step,
    appt_logged: !!c.apptLogged,
    created_at: c.created ? new Date(c.created).toISOString() : new Date().toISOString(),
    updated_at: c.updated ? new Date(c.updated).toISOString() : new Date().toISOString(),
    deleted_at: null
  };
}
 
function tombstoneRow(advisorId, convoId) {
  return {
    advisor_id: advisorId,
    convo_id: convoId,
    updated_at: new Date().toISOString(),
    deleted_at: new Date().toISOString()
  };
}
 
// Reconstructs a local conversation object from a cloud row. Falls back to
// "start" if a step key doesn't exist in this build's STEPS (e.g. restoring
// onto an older/newer script version).
function fromRemoteRow(row) {
  var step = STEPS[row.current_step] ? row.current_step : "start";
  return {
    id: row.convo_id,
    name: row.client_name || "",
    step: step,
    apptLogged: !!row.appt_logged,
    created: row.created_at ? Date.parse(row.created_at) : Date.now(),
    updated: row.updated_at ? Date.parse(row.updated_at) : Date.now()
  };
}
 
async function pushUpsert(advisorId, convo) {
  if (!supabaseClient) return false;
  try {
    var res = await supabaseClient.from(CONVERSATIONS_TABLE).upsert(toRemoteRow(advisorId, convo), { onConflict: "advisor_id,convo_id" });
    return !res.error;
  } catch (e) { return false; }
}
 
async function pushTombstone(advisorId, convoId) {
  if (!supabaseClient) return false;
  try {
    var res = await supabaseClient.from(CONVERSATIONS_TABLE).upsert(tombstoneRow(advisorId, convoId), { onConflict: "advisor_id,convo_id" });
    return !res.error;
  } catch (e) { return false; }
}
 
function defaultSyncMeta() { return { pendingUpsert: [], pendingDelete: [], lastSyncedAt: null, lastSyncStatus: "idle" }; }
function getSyncMeta(advisorId) { return lget(syncMetaKey(advisorId), defaultSyncMeta()); }
function setSyncMeta(advisorId, meta) { lset(syncMetaKey(advisorId), meta); }
 
var syncTimers = {};
var syncInFlight = {};
 
function scheduleSync(advisorId) {
  clearTimeout(syncTimers[advisorId]);
  syncTimers[advisorId] = setTimeout(function () { runSync(advisorId); }, 900);
}
 
// Marks a conversation as needing a background push. Called synchronously
// right after every local create/step-change/touch, so "pending" counts in
// Settings are accurate even before the debounced push fires.
function markDirty(advisorId, convoId) {
  var meta = getSyncMeta(advisorId);
  if (meta.pendingUpsert.indexOf(convoId) === -1) meta.pendingUpsert.push(convoId);
  setSyncMeta(advisorId, meta);
  scheduleSync(advisorId);
}
 
// Marks a conversation as needing a remote tombstone. Deleting locally is
// still instant and unconditional — this only queues the background half.
function markDeleted(advisorId, convoId) {
  var meta = getSyncMeta(advisorId);
  meta.pendingUpsert = meta.pendingUpsert.filter(function (id) { return id !== convoId; });
  if (meta.pendingDelete.indexOf(convoId) === -1) meta.pendingDelete.push(convoId);
  setSyncMeta(advisorId, meta);
  scheduleSync(advisorId);
}
 
// Never throws, never blocks the UI, never shows a popup. Safe to call as
// often as we like — it no-ops immediately when offline, unconfigured, or
// already running, and only touches localStorage + network.
async function runSync(advisorId) {
  if (!advisorId || !supabaseClient) return;
  if (syncInFlight[advisorId]) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) return;
 
  var meta = getSyncMeta(advisorId);
  if (meta.pendingUpsert.length === 0 && meta.pendingDelete.length === 0) return;
 
  syncInFlight[advisorId] = true;
  try {
    var convos = lget(convosKey(advisorId), []);
    var convoMap = {};
    convos.forEach(function (c) { convoMap[c.id] = c; });
 
    var stillPendingUpsert = [];
    for (var i = 0; i < meta.pendingUpsert.length; i++) {
      var id = meta.pendingUpsert[i];
      var c = convoMap[id];
      if (!c) continue; // deleted locally before it ever synced — nothing left to push
      var ok = await pushUpsert(advisorId, c);
      if (!ok) stillPendingUpsert.push(id);
    }
 
    var stillPendingDelete = [];
    for (var j = 0; j < meta.pendingDelete.length; j++) {
      var did = meta.pendingDelete[j];
      var ok2 = await pushTombstone(advisorId, did);
      if (!ok2) stillPendingDelete.push(did);
    }
 
    var fresh = getSyncMeta(advisorId); // re-read in case something queued more work mid-flight
    fresh.pendingUpsert = stillPendingUpsert.concat(
      fresh.pendingUpsert.filter(function (id) { return meta.pendingUpsert.indexOf(id) === -1; })
    );
    fresh.pendingDelete = stillPendingDelete.concat(
      fresh.pendingDelete.filter(function (id) { return meta.pendingDelete.indexOf(id) === -1; })
    );
    fresh.lastSyncedAt = Date.now();
    fresh.lastSyncStatus = (stillPendingUpsert.length === 0 && stillPendingDelete.length === 0) ? "synced" : "partial";
    setSyncMeta(advisorId, fresh);
  } catch (e) {
    // swallow — background sync failures must never surface as noisy errors
  } finally {
    syncInFlight[advisorId] = false;
  }
}
 
function syncStatusText(meta) {
  if (typeof navigator !== "undefined" && navigator.onLine === false) return "Offline — will back up when back online";
  var pending = (meta.pendingUpsert || []).length + (meta.pendingDelete || []).length;
  if (pending > 0) return pending + " change" + (pending === 1 ? "" : "s") + " waiting to sync";
  if (meta.lastSyncedAt) return "Backed up " + fmtAgo(meta.lastSyncedAt);
  return "Not backed up yet";
}
 
function slugify(s) {
  var out = (s || "advisor").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  return out || "advisor";
}
 
function todayStamp() {
  var d = new Date();
  function p(n) { return n < 10 ? "0" + n : "" + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
 
// Returns true/false rather than throwing, so callers can toast the
// advisor a real result instead of assuming the export always worked.
//
// On an iOS "Add to Home Screen" install specifically, a plain
// <a download> click often has nothing to hand the file to — there's no
// browser chrome, no Downloads folder, so the blob just opens as a wall of
// raw text in the same window. That's almost certainly what "copy from a
// textarea" actually was: not literal <textarea> code, but the CSV
// landing on-screen as text instead of becoming a file. The fix is to
// offer the file to the OS share sheet first (Save to Files, AirDrop,
// Messenger, email, etc.) wherever that API exists, and only fall back to
// the classic anchor-click download where it doesn't (desktop browsers,
// most Android WebViews).
async function downloadBlob(filename, mime, content) {
  var blob;
  try { blob = new Blob([content], { type: mime }); } catch (e) { return false; }
 
  if (navigator.share && navigator.canShare) {
    try {
      var file = new File([blob], filename, { type: mime });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return true;
      }
    } catch (e) {
      // AbortError means the advisor deliberately closed the share sheet —
      // respect that instead of immediately firing a second, unrequested
      // download right after they cancelled the first one.
      if (e && e.name === "AbortError") return false;
      // Any other failure (canShare lied, share() itself broke) falls
      // through to the classic download below.
    }
  }
 
  try {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return true;
  } catch (e2) {
    return false;
  }
}
 
function exportJSON(advisor, convos, prospects) {
  var payload = {
    exportedAt: new Date().toISOString(),
    appVersion: APP_VERSION,
    advisor: advisor,
    conversations: convos,
    prospects: prospects || []
  };
  return downloadBlob(
    "battle-river-script-backup-" + slugify(advisor && advisor.name) + "-" + todayStamp() + ".json",
    "application/json",
    JSON.stringify(payload, null, 2)
  );
}
 
function csvEscape(v) {
  var s = String(v == null ? "" : v);
  if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
 
function exportCSV(advisor, convos) {
  var rows = [["id", "client_name", "step_key", "step_title", "stage", "created", "updated"]];
  convos.forEach(function (c) {
    var step = STEPS[c.step] || STEPS.start;
    rows.push([
      c.id, c.name, c.step, step.title, step.stage,
      c.created ? new Date(c.created).toISOString() : "",
      c.updated ? new Date(c.updated).toISOString() : ""
    ]);
  });
  var csv = rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\n");
  return downloadBlob(
    "battle-river-script-backup-" + slugify(advisor && advisor.name) + "-" + todayStamp() + ".csv",
    "text/csv",
    csv
  );
}

async function fetchAllCloudProspects(advisorId) {

            style: { background: C.gold, color: "#06223B" },
            className: "flex-1 py-2.5 rounded-xl text-sm font-bold active:scale-[0.98] transition-transform"
          }, "Sync now"),
          h("button", {
            onClick: props.onCheckRestore,
            style: { background: C.surfaceAlt, borderColor: C.line, color: C.text },
            className: "flex-1 py-2.5 rounded-xl border text-sm font-semibold active:scale-[0.98] transition-transform"
          }, "Restore from cloud")
        )
      ),
 
      h("div", { style: { color: C.muted }, className: "text-[11px] font-mono uppercase tracking-widest mb-2.5" }, "Cloud backup \u2014 names list"),
      h("div", { style: { background: C.surface, borderColor: C.line }, className: "rounded-2xl border p-4 mb-6" },
        h("div", { className: "text-[13px] mb-3" }, syncStatusText(props.prospectSyncMeta)),
        h("div", { className: "flex gap-2" },
          h("button", {
            onClick: props.onSyncProspectsNow,
            style: { background: C.gold, color: "#06223B" },
            className: "flex-1 py-2.5 rounded-xl text-sm font-bold active:scale-[0.98] transition-transform"
          }, "Sync now"),
          h("button", {
            onClick: props.onCheckProspectRestore,
            style: { background: C.surfaceAlt, borderColor: C.line, color: C.text },
            className: "flex-1 py-2.5 rounded-xl border text-sm font-semibold active:scale-[0.98] transition-transform"
          }, "Restore from cloud")
        )
      ),
 
      h(ActivityLogStatusCard, { advisor: advisor }),
 
      isOneSignalConfigured() && h("div", null,
        h("div", { style: { color: C.muted }, className: "text-[11px] font-mono uppercase tracking-widest mb-2.5" }, "Daily overdue digest"),
        h("div", { style: { background: C.surface, borderColor: C.line }, className: "rounded-2xl border p-4 mb-6" },
          h("div", { style: { color: C.muted }, className: "text-[12px] mb-3 leading-relaxed" },
            "A once-a-day notification listing anything that's gone 3+ days without a touch \u2014 sent even if the app isn't open. Nothing sends if there's nothing overdue."),
          digestErr && h("div", { style: { color: "#F5A38C" }, className: "text-[12px] mb-2" }, digestErr),
          h("button", {
            onClick: toggleDigest,
            disabled: digestBusy,
            style: {
              background: digestOptIn ? C.surfaceAlt : C.gold,
              borderColor: C.line,
              color: digestOptIn ? C.text : "#06223B",
              opacity: digestBusy ? 0.6 : 1
            },
            className: "w-full py-2.5 rounded-xl border text-sm font-bold active:scale-[0.98] transition-transform"
          }, digestBusy ? "Working\u2026" : (digestOptIn ? "\u2713 On \u2014 tap to turn off" : "Turn on daily digest"))
        )
      ),
 
      h("div", { style: { color: C.muted }, className: "text-[11px] font-mono uppercase tracking-widest mb-2.5" }, "Export"),
      h("div", { style: { background: C.surface, borderColor: C.line }, className: "rounded-2xl border p-4 mb-6" },
        h("div", { style: { color: C.muted }, className: "text-[12px] mb-3" }, "A personal copy of everything on this device — not a substitute for the cloud backup above."),
        h("div", { className: "flex gap-2 mb-2" },
          h("button", {
            onClick: function () {
              exportJSON(advisor, convos, props.prospects).then(function (ok) {
                if (props.onFlash) props.onFlash(ok ? "Exported \u2014 check your Files/Downloads or share sheet" : "Couldn't export \u2014 try again");
              });
            },
            style: { background: C.surfaceAlt, borderColor: C.line, color: C.text },
            className: "flex-1 py-2.5 rounded-xl border text-sm font-semibold active:scale-[0.98] transition-transform"
          }, "Export JSON (everything)"),
          h("button", {
            onClick: function () {
              exportCSV(advisor, convos).then(function (ok) {
                if (props.onFlash) props.onFlash(ok ? "Exported \u2014 check your Files/Downloads or share sheet" : "Couldn't export \u2014 try again");
              });
            },
            style: { background: C.surfaceAlt, borderColor: C.line, color: C.text },
            className: "flex-1 py-2.5 rounded-xl border text-sm font-semibold active:scale-[0.98] transition-transform"
          }, "Export conversations CSV")
        ),
        h("button", {
          onClick: function () {
            exportProspectsCSV(advisor, props.prospects).then(function (ok) {
              if (props.onFlash) props.onFlash(ok ? "Exported \u2014 check your Files/Downloads or share sheet" : "Couldn't export \u2014 try again");
            });
          },
          style: { background: C.surfaceAlt, borderColor: C.line, color: C.text },
          className: "w-full py-2.5 rounded-xl border text-sm font-semibold active:scale-[0.98] transition-transform"
        }, "Export names list CSV")
      ),
 
      h("div", { style: { color: C.muted }, className: "text-[11px] leading-relaxed" },
        "This device is identified as " + (advisor ? advisor.name : "no one") +
        " by name only — there's no password. Anyone with access to this device could pick a different name. Treat this as attribution, not account security."),
 
      h("div", { style: { color: C.line }, className: "text-[10px] font-mono text-center mt-8 mb-2" }, "BRU Script " + APP_VERSION)
    )
  );
}
 
function StepScreen(props) {
  var convo = props.convo, onGo = props.onGo, onHome = props.onHome, onFlash = props.onFlash, onTouch = props.onTouch;
  var step = STEPS[convo.step] || STEPS.start;
  var stage = STAGES[step.stage];
  var copiedState = useState(null); var copiedIdx = copiedState[0], setCopiedIdx = copiedState[1];
  var level = urgency(convo);
 
  function doCopy(text, idx) {
    var out = fill(text, convo.name);
    copyText(out, function (ok) {
      if (ok) {
        setCopiedIdx(idx);
        setTimeout(function () { setCopiedIdx(null); }, 1800);
        if (onTouch) onTouch();
        onFlash("Copied \u2014 paste sa Messenger");
      } else {
        onFlash("Couldn't copy \u2014 long-press the text instead");
      }
    });
  }
 
  return h("div", { className: "max-w-md mx-auto pb-16" },
    h("div", {
      style: { background: C.surface, borderColor: C.line, top: "env(safe-area-inset-top)" },
      className: "px-5 pt-5 pb-4 border-b sticky top-0 z-10"
    },
      h("div", { className: "flex items-center justify-between mb-3" },
        h("button", { onClick: onHome, style: { color: C.muted }, className: "text-sm font-mono active:opacity-60" }, "\u2039 all chats"),
        h("div", { className: "flex items-center gap-1.5" },
          h("span", { style: { background: stage.color, width: "7px", height: "7px", borderRadius: "50%", display: "inline-block" } }),
          h("span", { style: { color: stage.color }, className: "text-[11px] font-mono uppercase tracking-wider" }, stage.label)
        )
      ),
      h("div", { className: "flex items-center gap-3" },
        h(Shield, { size: 30, uid: "step" }),
        h("div", { className: "min-w-0" },
          h("div", { className: "font-display text-2xl leading-tight truncate" }, convo.name),
          h("div", { className: "flex items-center gap-2 mt-0.5" },
            h("span", { style: { color: C.muted }, className: "text-sm" }, step.title),
            h("span", { style: { color: C.line } }, "\u00B7"),
            h("span", {
              style: { color: urgencyColor(level) },
              className: "text-[11px] font-mono" + (level === "high" ? " font-semibold" : "")
            }, fmtAgo(convo.updated))
          )
        )
      )
    ),
 
    level === "high" && h("div", { className: "px-5 pt-4" },
      h("div", {
        style: { background: "#2A1512", borderColor: urgencyColor("high"), color: "#F5A38C" },
        className: "rounded-xl border p-3 text-[13px] leading-relaxed"
      }, "Matagal na \u2014 " + fmtAgo(convo.updated) + " pa yung huling touch. Time to follow up.")
    ),
 
    h("div", { className: "px-5 pt-5" },
      step.note && h("div", {
        style: { background: C.surfaceAlt, borderColor: C.goldDim, color: C.goldSoft },
        className: "rounded-xl border p-3.5 text-[13px] leading-relaxed mb-4"
      }, step.note),
 
      step.scripts.length > 0 && h("div", { className: "space-y-3 mb-6" },
        step.scripts.map(function (s, idx) {
          var isCopied = copiedIdx === idx;
          return h("div", {
            key: idx,
            style: { background: C.surface, borderColor: isCopied ? C.gold : C.line },
            className: "rounded-2xl border overflow-hidden"
          },
            step.scripts.length > 1 && h("div", {
              style: { color: C.muted, borderColor: C.line },
              className: "px-4 pt-3 pb-2 text-[10px] font-mono uppercase tracking-widest"
            }, "Option " + (idx + 1)),
            h("div", { className: "px-4 pt-3 pb-4 text-[15px] leading-relaxed", style: { userSelect: "text" } },
              fill(s, convo.name)),
            h("button", {
              onClick: function () { doCopy(s, idx); },
              style: { background: isCopied ? C.good : C.gold, color: isCopied ? "#fff" : "#06223B" },
              className: "w-full py-3.5 font-bold text-[15px] active:scale-[0.98] transition-transform"
            }, isCopied ? "\u2713 Copied" : "Copy")
          );
        })
      ),
 
      h("div", { style: { color: C.muted }, className: "text-[11px] font-mono uppercase tracking-widest mb-2.5" },
        step.scripts.length > 0 ? "Ano sinagot ni client?" : "What's next?"),
      h("div", { className: "space-y-2" },
        step.choices.map(function (ch, idx) {
          return h("button", {
            key: idx,
            onClick: function () { onGo(ch.next); },
            style: { background: C.surfaceAlt, borderColor: C.line },
            className: "w-full text-left px-4 py-3.5 rounded-xl border text-[15px] active:scale-[0.99] transition-transform flex items-center justify-between gap-3"
          },
            h("span", null, ch.label),
            h("span", { style: { color: C.muted } }, "\u203A")
          );
        })
      ),
 
      convo.step !== "start" && h("button", {
        onClick: function () { onGo("start"); },
        style: { color: C.muted },
        className: "w-full mt-6 py-3 text-sm font-mono active:opacity-60"
      }, "restart this conversation")
    )
  );
}
 
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
