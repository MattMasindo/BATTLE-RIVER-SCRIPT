// Steps that mean the conversation is over — closed, or a dead lead.
// These must never sit at the top of the follow-up queue.
var FINISHED = { done: true, pass_sunlife: true };

function daysSince(ts) { return Math.floor((Date.now() - ts) / 86400000); }

function fmtAgo(ts) {
  if (!ts) return "";
  var mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  var d = Math.floor(hrs / 24);
  if (d === 1) return "yesterday";
  if (d < 7) return d + "d ago";
  var w = Math.floor(d / 7);
  if (d < 30) return w === 1 ? "1 week ago" : w + " weeks ago";
  var mo = Math.floor(d / 30);
  return mo === 1 ? "1 month ago" : mo + " months ago";
}

// Thresholds follow the script's own cadence: warm market is daily,
// cold market weekly — so 3 days is a nudge, 7 days is overdue.
function urgency(convo) {
  if (FINISHED[convo.step]) return "none";
  var d = daysSince(convo.updated);
  if (d >= 7) return "high";
  if (d >= 3) return "medium";
  return "low";
}

function urgencyColor(level) {
  if (level === "high") return "#E2603F";
  if (level === "medium") return "#F0B040";
  return "#8CA5BD";
}

function sortConvos(list, mode) {
  return list.slice().sort(function (a, b) {
    var af = FINISHED[a.step] ? 1 : 0, bf = FINISHED[b.step] ? 1 : 0;
    if (af !== bf) return af - bf;                    // finished always last
    if (mode === "stale") return a.updated - b.updated;  // longest untouched first
    return b.updated - a.updated;                     // most recently touched first
  });
}

function lget(k, fallback) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function lset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function fill(text, name) {
  var n = (name || "").trim();
  return text.replace(/\{name\}/g, n || "friend");
}

// Clipboard with a fallback — the Messenger in-app browser often blocks
// navigator.clipboard, and a silent failure here would break the whole point.
function copyText(text, done) {
  function fallback() {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      done(ok);
    } catch (e) { done(false); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
  } else { fallback(); }
}

function App() {
  var convosState = useState(lget("br-convos", [])); var convos = convosState[0], setConvos = convosState[1];
  var activeState = useState(null); var activeId = activeState[0], setActiveId = activeState[1];
  var newNameState = useState(""); var newName = newNameState[0], setNewName = newNameState[1];
  var searchState = useState(""); var search = searchState[0], setSearch = searchState[1];
  var sortState = useState(lget("br-sort", "stale")); var sortMode = sortState[0], setSortMode = sortState[1];
  var toastState = useState(null); var toast = toastState[0], setToast = toastState[1];

  useEffect(function () { lset("br-convos", convos); }, [convos]);
  useEffect(function () { lset("br-sort", sortMode); }, [sortMode]);

  function flash(msg) {
    setToast({ msg: msg, id: Date.now() });
    setTimeout(function () { setToast(null); }, 1600);
  }

  var active = null;
  for (var i = 0; i < convos.length; i++) { if (convos[i].id === activeId) active = convos[i]; }

  function startNew() {
    var nm = newName.trim();
    if (!nm) { flash("Enter the client's name first"); return; }
    var convo = { id: String(Date.now()), name: nm, step: "start", updated: Date.now() };
    setConvos([convo].concat(convos));
    setActiveId(convo.id);
    setNewName("");
    setSearch("");
  }

  function goTo(stepKey) {
    if (stepKey === "home") { setActiveId(null); return; }
    setConvos(convos.map(function (c) {
      return c.id === activeId ? Object.assign({}, c, { step: stepKey, updated: Date.now() }) : c;
    }));
  }

  // Copying a line means it got sent — on the "chase" steps the advisor
  // stays put, so without this the conversation would look untouched.
  function touch() {
    setConvos(convos.map(function (c) {
      return c.id === activeId ? Object.assign({}, c, { updated: Date.now() }) : c;
    }));
  }

  function removeConvo(id) {
    setConvos(convos.filter(function (c) { return c.id !== id; }));
    if (activeId === id) setActiveId(null);
  }

  var toastEl = toast ? h("div", {
    key: toast.id,
    className: "flash fixed left-0 right-0 flex justify-center z-50",
    style: { bottom: "28px", pointerEvents: "none" }

    style: { background: C.gold, color: "#06223B" },
    className: "px-5 py-2.5 rounded-full text-sm font-semibold shadow-lg"

  if (!active) {
    return h("div", { style: { background: C.bg, minHeight: "100vh", color: C.text } },
      h(HomeScreen, {
        convos: convos, newName: newName, setNewName: setNewName,
        search: search, setSearch: setSearch,
        sortMode: sortMode, setSortMode: setSortMode,
        onStart: startNew, onOpen: setActiveId, onRemove: removeConvo
      }),
      toastEl
    );
  }

  return h("div", { style: { background: C.bg, minHeight: "100vh", color: C.text } },
    h(StepScreen, { convo: active, onGo: goTo, onHome: function () { setActiveId(null); }, onFlash: flash, onTouch: touch }),
    toastEl
  );
}

  var q = props.search.trim().toLowerCase();
  var sorted = sortConvos(convos, props.sortMode);

    ? sorted.filter(function (c) { return c.name.toLowerCase().indexOf(q) !== -1; })
    : sorted;

  var needFollowUp = 0, overdue = 0;
  convos.forEach(function (c) {
    var u = urgency(c);

        style: { background: C.gold, color: "#06223B" },

          "Active \u00B7 " + convos.length),
        needFollowUp > 0 && h("div", {

        }, needFollowUp + " need follow-up")
      ),

      h("div", { className: "flex gap-1.5 mb-2.5" },
        [["stale", "Needs follow-up"], ["recent", "Recent"]].map(function (opt) {
          var on = props.sortMode === opt[0];
          return h("button", {
            key: opt[0],
            onClick: function () { props.setSortMode(opt[0]); },
            style: {
              background: on ? C.gold : "transparent",
              color: on ? "#06223B" : C.muted,
              borderColor: on ? C.gold : C.line
            },
            className: "px-3 py-1.5 rounded-full border text-[12px] font-semibold active:scale-95 transition-transform"
          }, opt[1]);
        })
      ),

      convos.length >= 5 && h("input", {
        value: props.search,
        onChange: function (ev) { props.setSearch(ev.target.value); },
        placeholder: "Search by name\u2026",
        style: { background: C.surface, borderColor: C.line, color: C.text },
        className: "w-full px-4 py-2.5 rounded-xl border outline-none text-[15px] mb-2.5"
      }),

      h("div", { className: "space-y-2" },
        shown.map(function (c) {
          var step = STEPS[c.step] || STEPS.start;
          var stage = STAGES[step.stage];
          var level = urgency(c);
          var finished = !!FINISHED[c.step];
          var uColor = urgencyColor(level);
          return h("div", {
            key: c.id,
            style: {
              background: C.surface,
              borderColor: level === "high" ? uColor : C.line,
              opacity: finished ? 0.55 : 1
            },
            className: "rounded-2xl border flex items-stretch overflow-hidden"
          },
            h("button", {
              onClick: function () { props.onOpen(c.id); },
              className: "flex-1 text-left px-4 py-3.5 min-w-0"
            },
              h("div", { className: "flex items-baseline justify-between gap-3" },
                h("div", { className: "font-semibold text-[15px] truncate" }, c.name),
                h("div", {
                  style: { color: finished ? C.muted : uColor },
                  className: "text-[11px] font-mono shrink-0" + (level === "high" ? " font-semibold" : "")
                }, fmtAgo(c.updated))
              ),
              h("div", { className: "flex items-center gap-2 mt-1 min-w-0" },
                h("span", { style: { background: stage.color, width: "7px", height: "7px", borderRadius: "50%", display: "inline-block", flexShrink: 0 } }),
                h("span", { style: { color: C.muted }, className: "text-xs truncate" }, step.title)
              )
            ),
            h("button", {
              onClick: function () { props.onRemove(c.id); },
              style: { color: C.muted, borderColor: C.line },
              className: "px-4 border-l text-lg active:opacity-60"
            }, "\u00D7")
          );
        })
      ),

      q && shown.length === 0 && h("div", { style: { color: C.muted }, className: "text-sm text-center py-6" },
        "Walang match for \u201C" + props.search.trim() + "\u201D")
    ),

    convos.length === 0 && h("div", { style: { color: C.muted }, className: "text-sm text-center px-6 leading-relaxed mt-2" },
      "Start a conversation and the script will remember exactly where you left off with each client.")
  );
}

function StepScreen(props) {
  var convo = props.convo, onGo = props.onGo, onHome = props.onHome, onFlash = props.onFlash, onTouch = props.onTouch;
  var step = STEPS[convo.step] || STEPS.start;
  var stage = STAGES[step.stage];
  var copiedState = useState(null); var copiedIdx = copiedState[0], setCopiedIdx = copiedState[1];
  var level = urgency(convo);

  function doCopy(text, idx) {
    var out = fill(text, convo.name);
    copyText(out, function (ok) {
      if (ok) {
        setCopiedIdx(idx);
        setTimeout(function () { setCopiedIdx(null); }, 1800);
        if (onTouch) onTouch();
        onFlash("Copied \u2014 paste sa Messenger");
      } else {
        onFlash("Couldn't copy \u2014 long-press the text instead");
      }
    });
  }

  return h("div", { className: "max-w-md mx-auto pb-16" },
    h("div", {
      style: { background: C.surface, borderColor: C.line },
      className: "px-5 pt-5 pb-4 border-b sticky top-0 z-10"
    },
      h("div", { className: "flex items-center justify-between mb-3" },
        h("button", { onClick: onHome, style: { color: C.muted }, className: "text-sm font-mono active:opacity-60" }, "\u2039 all chats"),
        h("div", { className: "flex items-center gap-1.5" },
          h("span", { style: { background: stage.color, width: "7px", height: "7px", borderRadius: "50%", display: "inline-block" } }),
          h("span", { style: { color: stage.color }, className: "text-[11px] font-mono uppercase tracking-wider" }, stage.label)
        )
      ),
      h("div", { className: "flex items-center gap-3" },
        h(Shield, { size: 30 }),
        h("div", { className: "min-w-0" },
          h("div", { className: "font-display text-2xl leading-tight truncate" }, convo.name),
          h("div", { className: "flex items-center gap-2 mt-0.5" },
            h("span", { style: { color: C.muted }, className: "text-sm" }, step.title),
            h("span", { style: { color: C.line } }, "\u00B7"),
            h("span", {
              style: { color: urgencyColor(level) },
              className: "text-[11px] font-mono" + (level === "high" ? " font-semibold" : "")
            }, fmtAgo(convo.updated))
          )
        )
      )
    ),

    level === "high" && h("div", { className: "px-5 pt-4" },
      h("div", {
        style: { background: "#2A1512", borderColor: urgencyColor("high"), color: "#F5A38C" },
        className: "rounded-xl border p-3 text-[13px] leading-relaxed"
      }, "Matagal na \u2014 " + fmtAgo(convo.updated) + " pa yung huling touch. Time to follow up.")
    ),

    h("div", { className: "px-5 pt-5" },
      step.note && h("div", {
        style: { background: C.surfaceAlt, borderColor: C.goldDim, color: C.goldSoft },
        className: "rounded-xl border p-3.5 text-[13px] leading-relaxed mb-4"
      }, step.note),

      step.scripts.length > 0 && h("div", { className: "space-y-3 mb-6" },
        step.scripts.map(function (s, idx) {
          var isCopied = copiedIdx === idx;
          return h("div", {
            key: idx,
            style: { background: C.surface, borderColor: isCopied ? C.gold : C.line },
            className: "rounded-2xl border overflow-hidden"
          },
            step.scripts.length > 1 && h("div", {
              style: { color: C.muted, borderColor: C.line },
              className: "px-4 pt-3 pb-2 text-[10px] font-mono uppercase tracking-widest"
            }, "Option " + (idx + 1)),
            h("div", { className: "px-4 pt-3 pb-4 text-[15px] leading-relaxed", style: { userSelect: "text" } },
              fill(s, convo.name)),
            h("button", {
              onClick: function () { doCopy(s, idx); },
              style: { background: isCopied ? C.good : C.gold, color: isCopied ? "#fff" : "#06223B" },
              className: "w-full py-3.5 font-bold text-[15px] active:scale-[0.98] transition-transform"
            }, isCopied ? "\u2713 Copied" : "Copy")
          );
        })
      ),

      h("div", { style: { color: C.muted }, className: "text-[11px] font-mono uppercase tracking-widest mb-2.5" },
        step.scripts.length > 0 ? "Ano sinagot ni client?" : "What's next?"),
      h("div", { className: "space-y-2" },
        step.choices.map(function (ch, idx) {
          return h("button", {
            key: idx,
            onClick: function () { onGo(ch.next); },
            style: { background: C.surfaceAlt, borderColor: C.line },
            className: "w-full text-left px-4 py-3.5 rounded-xl border text-[15px] active:scale-[0.99] transition-transform flex items-center justify-between gap-3"
          },
            h("span", null, ch.label),
            h("span", { style: { color: C.muted } }, "\u203A")
          );
        })
      ),

      convo.step !== "start" && h("button", {
        onClick: function () { onGo("start"); },
        style: { color: C.muted },
        className: "w-full mt-6 py-3 text-sm font-mono active:opacity-60"
      }, "restart this conversation")
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
