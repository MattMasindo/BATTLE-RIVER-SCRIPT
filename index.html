// Steps that mean the conversation is over — closed, or a dead lead.
// These must never sit at the top of the follow-up queue.
var FINISHED = { done: true, pass_sunlife: true };

function daysSince(ts) { return Math.floor((Date.now() - ts) / 86400000); }

function fmtAgo(ts) {
  if (!ts) return "";
  var mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  var d = Math.floor(hrs / 24);
  if (d === 1) return "yesterday";
  if (d < 7) return d + "d ago";
  var w = Math.floor(d / 7);
  if (d < 30) return w === 1 ? "1 week ago" : w + " weeks ago";
  var mo = Math.floor(d / 30);
  return mo === 1 ? "1 month ago" : mo + " months ago";
}

// Thresholds follow the script's own cadence: warm market is daily,
// cold market weekly — so 3 days is a nudge, 7 days is overdue.
function urgency(convo) {
  if (FINISHED[convo.step]) return "none";
  var d = daysSince(convo.updated);
  if (d >= 7) return "high";
  if (d >= 3) return "medium";
  return "low";
}

function urgencyColor(level) {
  if (level === "high") return "#E2603F";
  if (level === "medium") return "#F0B040";
  return "#8CA5BD";
}

function sortConvos(list, mode) {
  return list.slice().sort(function (a, b) {
    var af = FINISHED[a.step] ? 1 : 0, bf = FINISHED[b.step] ? 1 : 0;
    if (af !== bf) return af - bf;                    // finished always last
    if (mode === "stale") return a.updated - b.updated;  // longest untouched first
    return b.updated - a.updated;                     // most recently touched first
  });
}

function lget(k, fallback) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function lset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function fill(text, name) {
  var n = (name || "").trim();
  return text.replace(/\{name\}/g, n || "friend");
}

// Clipboard with a fallback — the Messenger in-app browser often blocks
// navigator.clipboard, and a silent failure here would break the whole point.
function copyText(text, done) {
  function fallback() {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      done(ok);
    } catch (e) { done(false); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
  } else { fallback(); }
}

// ======================================================================
// PATCH 1 — cloud backup / restore / export helpers.
// Nothing in this section touches STEPS, STAGES, or the 26-step flow.
// ======================================================================

// Per-advisor local storage bucket. Keeping conversations keyed by advisor
// id (rather than the single old "br-convos" key) is what stops a device
// changing hands from mixing one advisor's data into another's.
function convosKey(advisorId) { return "br-convos-" + advisorId; }
function syncMetaKey(advisorId) { return "br-sync-meta-" + advisorId; }

function rosterSelectColumns() {
  var cols = [ADVISOR_ID_COLUMN, ADVISOR_NAME_COLUMN];
  if (ADVISOR_ACTIVE_COLUMN) cols.push(ADVISOR_ACTIVE_COLUMN);
  return cols.join(",");
}

async function fetchRoster() {
  if (!supabaseClient) return { error: "Cloud isn't configured yet." };
  try {
    var q = supabaseClient.from(ADVISOR_TABLE).select(rosterSelectColumns()).order(ADVISOR_NAME_COLUMN, { ascending: true });
    if (ADVISOR_ACTIVE_COLUMN) q = q.eq(ADVISOR_ACTIVE_COLUMN, true);
    var res = await q;
    if (res.error) return { error: res.error.message };
    return {
      data: (res.data || []).map(function (row) {
        return { id: row[ADVISOR_ID_COLUMN], name: row[ADVISOR_NAME_COLUMN] };
      })
    };
  } catch (e) { return { error: "Couldn't reach the advisor list." }; }
}

async function fetchCloudConvos(advisorId) {
  if (!supabaseClient) return { data: [] };
  try {
    var res = await supabaseClient.from(CONVERSATIONS_TABLE).select("*").eq("advisor_id", advisorId).is("deleted_at", null);
    if (res.error) return { data: [], error: res.error.message };
    return { data: res.data || [] };
  } catch (e) { return { data: [], error: "Couldn't reach the backup." }; }
}

function toRemoteRow(advisorId, c) {
  return {
    advisor_id: advisorId,
    convo_id: c.id,
    client_name: c.name,
    current_step: c.step,
    created_at: c.created ? new Date(c.created).toISOString() : new Date().toISOString(),
    updated_at: c.updated ? new Date(c.updated).toISOString() : new Date().toISOString(),
    deleted_at: null
  };
}

function tombstoneRow(advisorId, convoId) {
  return {
    advisor_id: advisorId,
    convo_id: convoId,
    updated_at: new Date().toISOString(),
    deleted_at: new Date().toISOString()
  };
}

// Reconstructs a local conversation object from a cloud row. Falls back to
// "start" if a step key doesn't exist in this build's STEPS (e.g. restoring
// onto an older/newer script version).
function fromRemoteRow(row) {
  var step = STEPS[row.current_step] ? row.current_step : "start";
  return {
    id: row.convo_id,
    name: row.client_name || "",
    step: step,
    created: row.created_at ? Date.parse(row.created_at) : Date.now(),
    updated: row.updated_at ? Date.parse(row.updated_at) : Date.now()
  };
}

async function pushUpsert(advisorId, convo) {
  if (!supabaseClient) return false;
  try {
    var res = await supabaseClient.from(CONVERSATIONS_TABLE).upsert(toRemoteRow(advisorId, convo), { onConflict: "advisor_id,convo_id" });
    return !res.error;
  } catch (e) { return false; }
}

async function pushTombstone(advisorId, convoId) {
  if (!supabaseClient) return false;
  try {
    var res = await supabaseClient.from(CONVERSATIONS_TABLE).upsert(tombstoneRow(advisorId, convoId), { onConflict: "advisor_id,convo_id" });
    return !res.error;
  } catch (e) { return false; }
}

function defaultSyncMeta() { return { pendingUpsert: [], pendingDelete: [], lastSyncedAt: null, lastSyncStatus: "idle" }; }
function getSyncMeta(advisorId) { return lget(syncMetaKey(advisorId), defaultSyncMeta()); }
function setSyncMeta(advisorId, meta) { lset(syncMetaKey(advisorId), meta); }

var syncTimers = {};
var syncInFlight = {};

function scheduleSync(advisorId) {
  clearTimeout(syncTimers[advisorId]);
  syncTimers[advisorId] = setTimeout(function () { runSync(advisorId); }, 900);
}

// Marks a conversation as needing a background push. Called synchronously
// right after every local create/step-change/touch, so "pending" counts in
// Settings are accurate even before the debounced push fires.
function markDirty(advisorId, convoId) {
  var meta = getSyncMeta(advisorId);
  if (meta.pendingUpsert.indexOf(convoId) === -1) meta.pendingUpsert.push(convoId);
  setSyncMeta(advisorId, meta);
  scheduleSync(advisorId);
}

// Marks a conversation as needing a remote tombstone. Deleting locally is
// still instant and unconditional — this only queues the background half.
function markDeleted(advisorId, convoId) {
  var meta = getSyncMeta(advisorId);
  meta.pendingUpsert = meta.pendingUpsert.filter(function (id) { return id !== convoId; });
  if (meta.pendingDelete.indexOf(convoId) === -1) meta.pendingDelete.push(convoId);
  setSyncMeta(advisorId, meta);
  scheduleSync(advisorId);
}

// Never throws, never blocks the UI, never shows a popup. Safe to call as
// often as we like — it no-ops immediately when offline, unconfigured, or
// already running, and only touches localStorage + network.
async function runSync(advisorId) {
  if (!advisorId || !supabaseClient) return;
  if (syncInFlight[advisorId]) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) return;

  var meta = getSyncMeta(advisorId);
  if (meta.pendingUpsert.length === 0 && meta.pendingDelete.length === 0) return;

  syncInFlight[advisorId] = true;
  try {
    var convos = lget(convosKey(advisorId), []);
    var convoMap = {};
    convos.forEach(function (c) { convoMap[c.id] = c; });

    var stillPendingUpsert = [];
    for (var i = 0; i < meta.pendingUpsert.length; i++) {
      var id = meta.pendingUpsert[i];
      var c = convoMap[id];
      if (!c) continue; // deleted locally before it ever synced — nothing left to push
      var ok = await pushUpsert(advisorId, c);
      if (!ok) stillPendingUpsert.push(id);
    }

    var stillPendingDelete = [];
    for (var j = 0; j < meta.pendingDelete.length; j++) {
      var did = meta.pendingDelete[j];
      var ok2 = await pushTombstone(advisorId, did);
      if (!ok2) stillPendingDelete.push(did);
    }

    var fresh = getSyncMeta(advisorId); // re-read in case something queued more work mid-flight
    fresh.pendingUpsert = stillPendingUpsert.concat(
      fresh.pendingUpsert.filter(function (id) { return meta.pendingUpsert.indexOf(id) === -1; })
    );
    fresh.pendingDelete = stillPendingDelete.concat(
      fresh.pendingDelete.filter(function (id) { return meta.pendingDelete.indexOf(id) === -1; })
    );
    fresh.lastSyncedAt = Date.now();
    fresh.lastSyncStatus = (stillPendingUpsert.length === 0 && stillPendingDelete.length === 0) ? "synced" : "partial";
    setSyncMeta(advisorId, fresh);
  } catch (e) {
    // swallow — background sync failures must never surface as noisy errors
  } finally {
    syncInFlight[advisorId] = false;
  }
}

function syncStatusText(meta) {
  if (typeof navigator !== "undefined" && navigator.onLine === false) return "Offline — will back up when back online";
  var pending = (meta.pendingUpsert || []).length + (meta.pendingDelete || []).length;
  if (pending > 0) return pending + " change" + (pending === 1 ? "" : "s") + " waiting to sync";
  if (meta.lastSyncedAt) return "Backed up " + fmtAgo(meta.lastSyncedAt);
  return "Not backed up yet";
}

function slugify(s) {
  var out = (s || "advisor").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  return out || "advisor";
}

function todayStamp() {
  var d = new Date();
  function p(n) { return n < 10 ? "0" + n : "" + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function downloadBlob(filename, mime, content) {
  var blob = new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

function exportJSON(advisor, convos) {

    advisor: advisor,

  downloadBlob(
    "battle-river-script-backup-" + slugify(advisor && advisor.name) + "-" + todayStamp() + ".json",
    "application/json",
    JSON.stringify(payload, null, 2)

}

function csvEscape(v) {
  var s = String(v == null ? "" : v);
  if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportCSV(advisor, convos) {
  var rows = [["id", "client_name", "step_key", "step_title", "stage", "created", "updated"]];
  convos.forEach(function (c) {
    var step = STEPS[c.step] || STEPS.start;
    rows.push([
      c.id, c.name, c.step, step.title, step.stage,
      c.created ? new Date(c.created).toISOString() : "",
      c.updated ? new Date(c.updated).toISOString() : ""

  });
  var csv = rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\n");
  downloadBlob(
    "battle-river-script-backup-" + slugify(advisor && advisor.name) + "-" + todayStamp() + ".csv",
    "text/csv",
    csv
  );
}

    props.mode === "first-run" && h("div", { style: { color: C.muted }, className: "text-[13px] leading-relaxed mb-6" },
      "Pick your name once. This just attributes your conversations and backs them up under the right advisor — there's no password."),

    props.mode === "change" && h("div", {
      style: { background: C.surfaceAlt, borderColor: C.goldDim, color: C.goldSoft },
      className: "rounded-xl border p-3.5 text-[13px] leading-relaxed mb-6"
    }, "Switching identity won't delete or merge anything. Conversations already on this device stay saved under " +
      (props.currentName || "the current advisor") + ". The new advisor starts from their own backup, not from what's here now."),

    err && h("div", {
      style: { background: "#2A1512", borderColor: urgencyColor("high"), color: "#F5A38C" },
      className: "rounded-xl border p-3.5 text-[13px] leading-relaxed mb-4"
    }, err),

    roster === null && h("div", { style: { color: C.muted }, className: "text-sm text-center py-10" }, "Loading advisor list…"),

    roster !== null && roster.length === 0 && h("div", { className: "mb-4" },
      h("button", {
        onClick: function () { setReloadTick(reloadTick + 1); },
        style: { background: C.gold, color: "#06223B" },
        className: "w-full py-3.5 rounded-xl font-bold active:scale-[0.98] transition-transform"
      }, "Try again")
    ),

    roster && roster.length > 0 && h("div", { className: "space-y-2 mb-4" },
      roster.map(function (r) {
        return h("button", {
          key: r.id,
          onClick: function () { props.onSelect(r); },
          style: { background: C.surface, borderColor: C.line },
          className: "w-full text-left px-4 py-3.5 rounded-xl border text-[15px] active:scale-[0.99] transition-transform flex items-center justify-between gap-3"
        },
          h("span", null, r.name),
          h("span", { style: { color: C.muted } }, "›")
        );
      })
    ),

    props.onCancel && h("button", {
      onClick: props.onCancel,
      style: { color: C.muted },
      className: "w-full mt-2 py-3 text-sm font-mono active:opacity-60"
    }, "cancel")
  );
}

function SettingsScreen(props) {
  var advisor = props.advisor, convos = props.convos, meta = props.syncMeta;
  return h("div", { className: "max-w-md mx-auto pb-16" },
    h("div", {
      style: { background: C.surface, borderColor: C.line },
      className: "px-5 pt-5 pb-4 border-b sticky top-0 z-10"
    },
      h("button", { onClick: props.onBack, style: { color: C.muted }, className: "text-sm font-mono active:opacity-60 mb-3" }, "‹ all chats"),
      h("div", { className: "font-display text-2xl" }, "Settings")
    ),

    h("div", { className: "px-5 pt-5" },

      h("div", { style: { color: C.muted }, className: "text-[11px] font-mono uppercase tracking-widest mb-2.5" }, "Identity"),
      h("div", { style: { background: C.surface, borderColor: C.line }, className: "rounded-2xl border p-4 mb-6" },
        h("div", { className: "text-[15px] font-semibold mb-1" }, advisor ? advisor.name : "Not set"),
        h("div", { style: { color: C.muted }, className: "text-[12px] mb-3" }, "Conversations on this device back up under this name."),
        h("button", {
          onClick: props.onChangeIdentity,
          style: { background: C.surfaceAlt, borderColor: C.line, color: C.text },
          className: "w-full py-2.5 rounded-xl border text-sm font-semibold active:scale-[0.98] transition-transform"
        }, "Change identity")
      ),

      h("div", { style: { color: C.muted }, className: "text-[11px] font-mono uppercase tracking-widest mb-2.5" }, "Cloud backup"),
      h("div", { style: { background: C.surface, borderColor: C.line }, className: "rounded-2xl border p-4 mb-6" },
        h("div", { className: "text-[13px] mb-3" }, syncStatusText(meta)),
        h("div", { className: "flex gap-2" },
          h("button", {
            onClick: props.onSyncNow,
            style: { background: C.gold, color: "#06223B" },
            className: "flex-1 py-2.5 rounded-xl text-sm font-bold active:scale-[0.98] transition-transform"
          }, "Sync now"),
          h("button", {
            onClick: props.onCheckRestore,
            style: { background: C.surfaceAlt, borderColor: C.line, color: C.text },
            className: "flex-1 py-2.5 rounded-xl border text-sm font-semibold active:scale-[0.98] transition-transform"
          }, "Restore from cloud")
        )
      ),

      h("div", { style: { color: C.muted }, className: "text-[11px] font-mono uppercase tracking-widest mb-2.5" }, "Export"),
      h("div", { style: { background: C.surface, borderColor: C.line }, className: "rounded-2xl border p-4 mb-6" },
        h("div", { style: { color: C.muted }, className: "text-[12px] mb-3" }, "A personal copy of everything on this device — not a substitute for the cloud backup above."),
        h("div", { className: "flex gap-2" },
          h("button", {
            onClick: function () { exportJSON(advisor, convos); },
            style: { background: C.surfaceAlt, borderColor: C.line, color: C.text },
            className: "flex-1 py-2.5 rounded-xl border text-sm font-semibold active:scale-[0.98] transition-transform"
          }, "Export JSON"),
          h("button", {
            onClick: function () { exportCSV(advisor, convos); },
            style: { background: C.surfaceAlt, borderColor: C.line, color: C.text },
            className: "flex-1 py-2.5 rounded-xl border text-sm font-semibold active:scale-[0.98] transition-transform"
          }, "Export CSV")
        )
      ),

      h("div", { style: { color: C.muted }, className: "text-[11px] leading-relaxed" },
        "This device is identified as " + (advisor ? advisor.name : "no one") +
        " by name only — there's no password. Anyone with access to this device could pick a different name. Treat this as attribution, not account security.")
    )
  );
}

function StepScreen(props) {
  var convo = props.convo, onGo = props.onGo, onHome = props.onHome, onFlash = props.onFlash, onTouch = props.onTouch;
  var step = STEPS[convo.step] || STEPS.start;
  var stage = STAGES[step.stage];
  var copiedState = useState(null); var copiedIdx = copiedState[0], setCopiedIdx = copiedState[1];
  var level = urgency(convo);

  function doCopy(text, idx) {
    var out = fill(text, convo.name);
    copyText(out, function (ok) {
      if (ok) {
        setCopiedIdx(idx);
        setTimeout(function () { setCopiedIdx(null); }, 1800);
        if (onTouch) onTouch();
        onFlash("Copied \u2014 paste sa Messenger");
      } else {
        onFlash("Couldn't copy \u2014 long-press the text instead");
      }
    });
  }

  return h("div", { className: "max-w-md mx-auto pb-16" },
    h("div", {
      style: { background: C.surface, borderColor: C.line },
      className: "px-5 pt-5 pb-4 border-b sticky top-0 z-10"
    },
      h("div", { className: "flex items-center justify-between mb-3" },
        h("button", { onClick: onHome, style: { color: C.muted }, className: "text-sm font-mono active:opacity-60" }, "\u2039 all chats"),
        h("div", { className: "flex items-center gap-1.5" },
          h("span", { style: { background: stage.color, width: "7px", height: "7px", borderRadius: "50%", display: "inline-block" } }),
          h("span", { style: { color: stage.color }, className: "text-[11px] font-mono uppercase tracking-wider" }, stage.label)
        )
      ),
      h("div", { className: "flex items-center gap-3" },
        h(Shield, { size: 30, uid: "step" }),
        h("div", { className: "min-w-0" },
          h("div", { className: "font-display text-2xl leading-tight truncate" }, convo.name),
          h("div", { className: "flex items-center gap-2 mt-0.5" },
            h("span", { style: { color: C.muted }, className: "text-sm" }, step.title),
            h("span", { style: { color: C.line } }, "\u00B7"),
            h("span", {
              style: { color: urgencyColor(level) },
              className: "text-[11px] font-mono" + (level === "high" ? " font-semibold" : "")
            }, fmtAgo(convo.updated))
          )
        )
      )
    ),

    level === "high" && h("div", { className: "px-5 pt-4" },
      h("div", {
        style: { background: "#2A1512", borderColor: urgencyColor("high"), color: "#F5A38C" },
        className: "rounded-xl border p-3 text-[13px] leading-relaxed"
      }, "Matagal na \u2014 " + fmtAgo(convo.updated) + " pa yung huling touch. Time to follow up.")
    ),

    h("div", { className: "px-5 pt-5" },
      step.note && h("div", {
        style: { background: C.surfaceAlt, borderColor: C.goldDim, color: C.goldSoft },
        className: "rounded-xl border p-3.5 text-[13px] leading-relaxed mb-4"
      }, step.note),

      step.scripts.length > 0 && h("div", { className: "space-y-3 mb-6" },
        step.scripts.map(function (s, idx) {
          var isCopied = copiedIdx === idx;
          return h("div", {
            key: idx,
            style: { background: C.surface, borderColor: isCopied ? C.gold : C.line },
            className: "rounded-2xl border overflow-hidden"
          },
            step.scripts.length > 1 && h("div", {
              style: { color: C.muted, borderColor: C.line },
              className: "px-4 pt-3 pb-2 text-[10px] font-mono uppercase tracking-widest"
            }, "Option " + (idx + 1)),
            h("div", { className: "px-4 pt-3 pb-4 text-[15px] leading-relaxed", style: { userSelect: "text" } },
              fill(s, convo.name)),
            h("button", {
              onClick: function () { doCopy(s, idx); },
              style: { background: isCopied ? C.good : C.gold, color: isCopied ? "#fff" : "#06223B" },
              className: "w-full py-3.5 font-bold text-[15px] active:scale-[0.98] transition-transform"
            }, isCopied ? "\u2713 Copied" : "Copy")
          );
        })
      ),

      h("div", { style: { color: C.muted }, className: "text-[11px] font-mono uppercase tracking-widest mb-2.5" },
        step.scripts.length > 0 ? "Ano sinagot ni client?" : "What's next?"),
      h("div", { className: "space-y-2" },
        step.choices.map(function (ch, idx) {
          return h("button", {
            key: idx,
            onClick: function () { onGo(ch.next); },
            style: { background: C.surfaceAlt, borderColor: C.line },
            className: "w-full text-left px-4 py-3.5 rounded-xl border text-[15px] active:scale-[0.99] transition-transform flex items-center justify-between gap-3"
          },
            h("span", null, ch.label),
            h("span", { style: { color: C.muted } }, "\u203A")
          );
        })
      ),

      convo.step !== "start" && h("button", {
        onClick: function () { onGo("start"); },
        style: { color: C.muted },
        className: "w-full mt-6 py-3 text-sm font-mono active:opacity-60"
      }, "restart this conversation")
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
